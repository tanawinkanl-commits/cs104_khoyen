<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body class="container mt-5">

<h1>Edit Product</h1>

<form method="POST">

<div class="mb-3">
    <label>Product Name</label>

    <input type="text"
           name="product_name"
           value="{{ product.product_name }}"
           class="form-control">
</div>

<div class="mb-3">
    <label>Price</label>

    <input type="text"
           name="price"
           value="{{ product.price }}"
           class="form-control">
</div>

<div class="mb-3">
    <label>Image File Name</label>

    <input type="text"
           name="image"
           value="{{ product.image }}"
           class="form-control">
</div>

<button type="submit"
        class="btn btn-primary">
        Update
</button>

</form>

</body>
</html>
