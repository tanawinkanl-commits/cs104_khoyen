<!DOCTYPE html>
<html>
<head>
    <title>Coffee Shop</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>

        body{
            margin: 0;
            padding: 0;
            font-family: Arial;
            background:
            linear-gradient(rgba(0,0,0,0.5),
            rgba(0,0,0,0.5)),
            url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?q=80&w=1600');

            background-size: cover;
            background-position: center;
            height: 100vh;
            color: white;
        }

        .hero{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            text-align: center;
        }

        h1{
            font-size: 70px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        p{
            font-size: 22px;
            margin-bottom: 40px;
        }

        .btn-custom{
            padding: 15px 35px;
            font-size: 20px;
            border-radius: 40px;
            margin: 10px;
            border: none;
            transition: 0.3s;
        }

        .btn-products{
            background: #6f4e37;
            color: white;
        }

        .btn-products:hover{
            background: #8b5e3c;
            transform: scale(1.05);
        }

        .btn-customers{
            background: #c4a484;
            color: white;
        }

        .btn-customers:hover{
            background: #ddb892;
            transform: scale(1.05);
        }

        .glass{
            background: rgba(255,255,255,0.1);
            padding: 50px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
        }

    </style>
</head>

<body>

<div class="hero">

    <div class="glass">

        <h1>☕ Coffee Shop</h1>

        <p>
            Fresh Coffee • Sweet Moments • Cozy Place
        </p>

        <a href="/products"
           class="btn btn-custom btn-products">
           View Products
        </a>

        <a href="/customers"
           class="btn btn-custom btn-customers">
           Customers
        </a>

    </div>

</div>

<!-- เพลง -->
<audio autoplay loop>
    <source
    src="https://www.bensound.com/bensound-music/bensound-sunny.mp3"
    type="audio/mp3">
</audio>

</body>
</html>
