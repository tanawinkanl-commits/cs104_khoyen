<!DOCTYPE html>
<html>
<head>
    <title>Add Product</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body class="container mt-5">

<h1>Add Product</h1>

<form method="POST">

<div class="mb-3">
    <label>Product Name</label>

    <input type="text"
           name="product_name"
           class="form-control">
</div>

<div class="mb-3">
    <label>Price</label>

    <input type="text"
           name="price"
           class="form-control">
</div>

<div class="mb-3">
    <label>Image File Name</label>

    <input type="text"
           name="image"
           class="form-control"
           placeholder="latte.jpg">
</div>

<button type="submit"
        class="btn btn-success">
        Save
</button>

</form>

</body>
</html>
