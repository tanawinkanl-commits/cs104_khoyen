<!DOCTYPE html>
<html>
<head>
    <title>Add New Coffee</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <style>

        body{
            background: linear-gradient(to right, #4b2e2e, #8b5e3c);
            min-height: 100vh;
            font-family: Arial;
        }

        .form-box{
            background: white;
            padding: 40px;
            border-radius: 25px;
            margin-top: 60px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        h1{
            color: #6f4e37;
            font-weight: bold;
        }

        .btn-save{
            background: #6f4e37;
            color: white;
            border-radius: 30px;
            padding: 10px;
            font-weight: bold;
        }

        .btn-save:hover{
            background: #8b5e3c;
            color: white;
        }

        .btn-back{
            border-radius: 30px;
            padding: 10px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="form-box">

                <h1 class="text-center mb-4">
                    ☕ Add New Coffee
                </h1>

                <form method="POST">

                    <div class="mb-3">

                        <label>Coffee Name</label>

                        <input
                        type="text"
                        name="product_name"
                        class="form-control"
                        required>

                    </div>

                    <div class="mb-3">

                        <label>Price</label>

                        <input
                        type="text"
                        name="price"
                        class="form-control"
                        required>

                    </div>

                    <div class="mb-3">

                        <label>Image File Name</label>

                        <input
                        type="text"
                        name="image"
                        class="form-control"
                        placeholder="latte.jpg"
                        required>

                    </div>

                    <button
                    type="submit"
                    class="btn btn-save w-100 mb-3">

                    Save Coffee

                    </button>

                    <a href="/products"
                       class="btn btn-secondary btn-back w-100">

                       ⬅ Back to Products

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
